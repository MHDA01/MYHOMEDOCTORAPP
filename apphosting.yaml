runConfig:
  minInstances: 0
  maxInstances: 4
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: ABACUS_API_KEY
    secret: ABACUS_API_KEY
    availability:
      - RUNTIME
  - variable: MHD_FIREBASE_PROJECT_ID
    secret: MHD_FIREBASE_PROJECT_ID
    availability:
      - RUNTIME
  - variable: MHD_FIREBASE_CLIENT_EMAIL
    secret: MHD_FIREBASE_CLIENT_EMAIL
    availability:
      - RUNTIME
  - variable: MHD_FIREBASE_PRIVATE_KEY
    secret: MHD_FIREBASE_PRIVATE_KEY
    availability:
      - RUNTIME
  - variable: MHD_FIREBASE_STORAGE_BUCKET
    secret: MHD_FIREBASE_STORAGE_BUCKET
    availability:
      - RUNTIME
  - variable: MHDA_ENCRYPTION_KEY
    secret: MHDA_ENCRYPTION_KEY
    availability:
      - RUNTIME
