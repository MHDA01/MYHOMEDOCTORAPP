# El techo de cuántas personas pueden estar consultando A LA VEZ es
# `maxInstances` × `concurrency`. Con 4 × 80 eran 320: el turno 321 lo encola
# Cloud Run y, si la cola no se vacía, lo rechaza. Con 20 × 80 son 1.600, que
# cubre las 1.000 personas del lanzamiento con margen.
#
# Subirlo no cuesta nada mientras nadie consulte: `minInstances: 0` significa
# que no hay ninguna instancia despierta: se encienden cuando llega tráfico y se
# apagan solas. Lo que sí cuesta es Gemini, dos llamadas por turno, y el camino
# del paciente todavía no tiene límite por IP (`limite-peticiones.ts` solo lo usa
# `/api/salud`). Así que esto levanta el techo de personas, no el de un bucle.
#
# Dos cosas medidas el 10-nov-2026 (`npm run medir:carga`) que conviene tener
# aquí antes de tocar estos números otra vez:
#
#  - Con 80 turnos a la vez en UNA instancia nada falla, pero lo nuestro
#    —guardado cifrado, permisos, historial, ficha— ya añade ~1,5 s sobre la
#    espera del modelo, y eso fue en un portátil con más CPU que este
#    contenedor. Si hace falta recortar esa espera, el camino es bajar
#    `concurrency` y no subir `maxInstances`.
#  - A 320 en una sola instancia el proceso se ahoga y el pico de memoria llegó
#    a 414 MiB, pegado a estos 512. Por eso la respuesta a más carga es más
#    instancias, no más concurrencia por instancia.
#
# Y `maxInstances` también multiplica el límite por IP de `/api/salud`, porque
# cada instancia lleva su cuenta en memoria: el límite real es el configurado
# por el número de instancias despiertas.
runConfig:
  minInstances: 0
  maxInstances: 20
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME
  - variable: MHD_FIREBASE_PROJECT_ID
    secret: MHD_FIREBASE_PROJECT_ID
    availability:
      - RUNTIME
  - variable: MHD_FIREBASE_CLIENT_EMAIL
    secret: MHD_FIREBASE_CLIENT_EMAIL
    availability:
      - RUNTIME
  - variable: MHD_FIREBASE_PRIVATE_KEY
    secret: MHD_FIREBASE_PRIVATE_KEY
    availability:
      - RUNTIME
  - variable: MHDA_ENCRYPTION_KEY
    secret: MHDA_ENCRYPTION_KEY
    availability:
      - RUNTIME

  # Config pública del cliente Firebase/Wompi — no son secretos, Firebase los expone
  # a propósito en el bundle del navegador. Sin esto, next build falla al pre-renderizar
  # páginas que inicializan el SDK de Firebase (ej. /login).
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyAp65amh6olkSyo94sYxaBD9E2frbkws44
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: myhomedoctorapp.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_DATABASE_URL
    value: https://myhomedoctorapp-default-rtdb.firebaseio.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: myhomedoctorapp
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: myhomedoctorapp.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "138646987953"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:138646987953:web:8d668e0db76f20974dae90"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_MEASUREMENT_ID
    value: G-JQQL7L8WL0
    availability:
      - BUILD
      - RUNTIME

  # Clave pública del certificado push web (VAPID) del proyecto, creada el
  # 30-ago-2025. Sin ella requestNotificationPermission() abortaba antes de
  # pedir permiso, y por eso ningún usuario tenía token de notificación.
  # Es pública por diseño: viaja al navegador para suscribirse a FCM.
  - variable: NEXT_PUBLIC_FIREBASE_VAPID_KEY
    value: BAQf8lZ9QyRd4PCOhden33ox18bwZbh0bt7s6fSVACmPJcxjrnwizG6SJrQ9UEJxp0TYY7jKCcB_kimv0O3dTA4
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_WOMPI_PUBLIC_KEY
    value: pub_prod_HEfS9EpvKwmC8QL9UojA5uBUHOyeKSu2
    availability:
      - BUILD
      - RUNTIME

  # Correos con acceso al panel de administración (src/lib/admin-access.ts).
  # Es un secreto y no un valor escrito aquí porque este repositorio es público.
  - variable: ADMIN_EMAILS
    secret: ADMIN_EMAILS
    availability:
      - RUNTIME
