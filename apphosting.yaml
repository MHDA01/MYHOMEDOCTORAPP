runConfig:
  minInstances: 0
  maxInstances: 4
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME
  - variable: MHD_FIREBASE_PROJECT_ID
    secret: MHD_FIREBASE_PROJECT_ID
    availability:
      - RUNTIME
  - variable: MHD_FIREBASE_CLIENT_EMAIL
    secret: MHD_FIREBASE_CLIENT_EMAIL
    availability:
      - RUNTIME
  - variable: MHD_FIREBASE_PRIVATE_KEY
    secret: MHD_FIREBASE_PRIVATE_KEY
    availability:
      - RUNTIME
  - variable: MHDA_ENCRYPTION_KEY
    secret: MHDA_ENCRYPTION_KEY
    availability:
      - RUNTIME

  # Config pública del cliente Firebase/Wompi — no son secretos, Firebase los expone
  # a propósito en el bundle del navegador. Sin esto, next build falla al pre-renderizar
  # páginas que inicializan el SDK de Firebase (ej. /login).
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyAp65amh6olkSyo94sYxaBD9E2frbkws44
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: myhomedoctorapp.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_DATABASE_URL
    value: https://myhomedoctorapp-default-rtdb.firebaseio.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: myhomedoctorapp
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: myhomedoctorapp.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "138646987953"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:138646987953:web:8d668e0db76f20974dae90"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_MEASUREMENT_ID
    value: G-JQQL7L8WL0
