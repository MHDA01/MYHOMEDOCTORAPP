# Pruebas automáticas de MHDA.
#
# Corre en cada push y en cada pull request. No publica nada: App Hosting sigue
# publicando solo al subir a master. Si este flujo sale en rojo, no subas a master
# hasta arreglarlo.
name: Pruebas

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Los emuladores de Firebase necesitan Java 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Caché de los emuladores
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: emuladores-firebase-15.7.0

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Firebase CLI
        run: npm install --global firebase-tools@15.7.0

      - name: Revisión de tipos
        run: npm run typecheck

      - name: Pruebas (con emuladores, proyecto demo-mhda)
        run: npm test

      - name: Compilación de producción
        run: npm run build
        env:
          # Configuración pública del cliente (la misma de apphosting.yaml). No son secretos.
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyAp65amh6olkSyo94sYxaBD9E2frbkws44
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: myhomedoctorapp.firebaseapp.com
          NEXT_PUBLIC_DATABASE_URL: https://myhomedoctorapp-default-rtdb.firebaseio.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: myhomedoctorapp
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: myhomedoctorapp.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "138646987953"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:138646987953:web:8d668e0db76f20974dae90"
          NEXT_PUBLIC_MEASUREMENT_ID: G-JQQL7L8WL0
          NEXT_PUBLIC_WOMPI_PUBLIC_KEY: pub_prod_HEfS9EpvKwmC8QL9UojA5uBUHOyeKSu2
